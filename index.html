<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ORBIA · Every place you've been, on one map</title>
<meta name="description" content="ORBIA prototype: pin your travel photos on a hand-drawn map of India, turn trips into scrapbooks, and collect a stamp for every state.">
<meta property="og:title" content="ORBIA · Every place you've been, on one map">
<meta property="og:description" content="Try the ORBIA prototype: your travel photos on a hand-drawn map of India.">
<meta name="theme-color" content="#FBE1E9">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23B82A5E'/%3E%3Ccircle cx='32' cy='32' r='15' fill='none' stroke='%23FFFDF8' stroke-width='9'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@400;600;700;800&amp;family=Gochi+Hand&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%}
body{background:#FBE1E9;font-family:'Nunito',system-ui,sans-serif;color:#3B1D33;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;overflow-x:hidden}
.top{display:flex;flex-direction:column;align-items:center;gap:6px;margin:18px 0 14px}
.top p{margin:0;font-family:'Gochi Hand',cursive;font-size:20px;color:#B82A5E}
.frame{position:relative}
.phone{position:absolute;left:0;top:0;width:390px;height:844px;transform-origin:0 0;border-radius:46px;overflow:hidden;box-shadow:0 0 0 10px #3B1D33,0 30px 60px rgba(59,29,51,.28);background:#FBE1E9}
.foot{margin:22px 0 20px;font-size:13px;color:#7A5E6E}
body.mobile .top,body.mobile .foot{display:none}
body.mobile{justify-content:flex-start}
body.mobile .phone{border-radius:0;box-shadow:none}

body{margin:0}
a{color:#B82A5E}a:hover{color:#8C1F47}
button{font-family:inherit}
*{scrollbar-width:none;-ms-overflow-style:none}
.ph{background-size:cover !important;background-position:center !important}
.ph > svg{display:none}
.ph-goa-0{background-image:url(img/goa-0.jpg)}
.ph-goa-1{background-image:url(img/goa-1.jpg)}
.ph-goa-2{background-image:url(img/goa-2.jpg)}
.ph-goa-3{background-image:url(img/goa-3.jpg)}

*::-webkit-scrollbar{display:none;width:0;height:0}

</style>
</head>
<body>
<header class="top"><svg viewBox="22 32 572 226" width="92" role="img" aria-label="orbia"><g fill="none" stroke="#B82A5E" stroke-linecap="round" stroke-linejoin="round"><circle cx="92" cy="168" r="50" stroke-width="30"/><path d="M92 168 m-6 0 a6 6 0 1 1 12 0 a17 17 0 1 1 -34 0 a27 27 0 1 1 54 0" stroke-width="9"/><path d="M190 124 L190 214 M190 166 C190 136 213 120 243 124" stroke-width="30"/><path d="M286 52 L286 214" stroke-width="30"/><circle cx="334" cy="166" r="48" stroke-width="30"/><path d="M430 128 L430 214" stroke-width="30"/><circle cx="526" cy="166" r="48" stroke-width="30"/><path d="M574 124 L574 214 C574 226 572 233 568 238" stroke-width="30"/></g><circle cx="430" cy="84" r="17" fill="#B82A5E"/></svg><p>tap through the prototype</p></header>
<div class="frame" id="frame"><div class="phone" id="phone"><div id="app"></div></div></div>
<p class="foot">ORBIA · prototype · 2026</p>
<template id="screens"><div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FBE1E9; font-family: 'Nunito', system-ui, sans-serif; color: #3B1D33; box-sizing: border-box">

<!-- ONBOARDING 1 -->
<sc-if value="{{isOnboard1}}" hint-placeholder-val="{{ true }}">
<div style="height: 844px; display: flex; flex-direction: column; background: #B82A5E">
<div style="position: relative; height: 500px; display: flex; flex-direction: column; align-items: center; padding-top: 44px; box-sizing: border-box">
<svg width="96" height="38" viewBox="22 32 572 226" role="img" aria-label="orbia"><g fill="none" stroke="#FFFDF8" stroke-linecap="round" stroke-linejoin="round"><circle cx="92" cy="168" r="50" stroke-width="30"></circle><path d="M92 168 m-6 0 a6 6 0 1 1 12 0 a17 17 0 1 1 -34 0 a27 27 0 1 1 54 0" stroke-width="9"></path><path d="M190 124 L190 214 M190 166 C190 136 213 120 243 124" stroke-width="30"></path><path d="M286 52 L286 214" stroke-width="30"></path><circle cx="334" cy="166" r="48" stroke-width="30"></circle><path d="M430 128 L430 214" stroke-width="30"></path><circle cx="526" cy="166" r="48" stroke-width="30"></circle><path d="M574 124 L574 214 C574 226 572 233 568 238" stroke-width="30"></path></g><circle cx="430" cy="84" r="17" fill="#FFFDF8"></circle></svg>
<svg width="390" height="440" viewBox="0 0 390 440" aria-hidden="true" style="position: absolute; left: 0; top: 60px">
<path d="M-10 360 C 70 300 110 380 190 330 S 320 250 400 290" fill="none" stroke="#FFFDF8" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 12"/>
<path d="M64 74 C65.92 88.08 65.92 88.08 80 90 C65.92 91.92 65.92 91.92 64 106 C62.08 91.92 62.08 91.92 48 90 C62.08 88.08 62.08 88.08 64 74 Z" fill="#FFC83D"/><path d="M330 138 C331.44 148.56 331.44 148.56 342 150 C331.44 151.44 331.44 151.44 330 162 C328.56 151.44 328.56 151.44 318 150 C328.56 148.56 328.56 148.56 330 138 Z" fill="#FFFDF8"/><path d="M310 62 C310.96 69.04 310.96 69.04 318 70 C310.96 70.96 310.96 70.96 310 78 C309.04 70.96 309.04 70.96 302 70 C309.04 69.04 309.04 69.04 310 62 Z" fill="#FFC83D"/><path d="M54 241 C55.08 248.92 55.08 248.92 63 250 C55.08 251.08 55.08 251.08 54 259 C52.92 251.08 52.92 251.08 45 250 C52.92 248.92 52.92 248.92 54 241 Z" fill="#FFFDF8"/>
</svg>
<div style="position: absolute; left: 70px; top: 120px"><svg width="250" height="270" viewBox="0 0 250 270" role="img" aria-label="A postage stamp">
<g transform="rotate(-6 125 135)">
<rect x="25" y="20" width="200" height="230" fill="#FFFDF8" stroke="#B82A5E" stroke-width="14" stroke-dasharray="0.1 17" stroke-linecap="round"/>
<rect x="47" y="42" width="156" height="186" fill="#F6C9D3"/>
<path d="M47 190 C 90 160 140 176 203 150 L203 228 L47 228 Z" fill="#FBE1E9"/>
<circle cx="150" cy="112" r="24" fill="#FFC83D"/>
<path d="M47 200 C 80 140 120 150 150 180 C 170 160 190 158 203 166 L203 228 L47 228 Z" fill="#B82A5E" fill-opacity="0.85"/>
<text x="190" y="72" text-anchor="end" font-family="Fredoka, sans-serif" font-weight="600" font-size="20" fill="#B82A5E">₹25</text>
</g>
<g transform="rotate(14 205 222)" fill="none" stroke="#FFC83D" stroke-width="4"><circle cx="205" cy="222" r="34"/><circle cx="205" cy="222" r="21"/></g>
</svg></div>
</div>
<div style="flex: 1; background: #FFFDF8; border-radius: 36px 36px 0 0; padding: 32px 28px 36px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; align-items: center; text-align: center">
<div style="display: flex; flex-direction: column; gap: 10px; align-items: center">
<h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 34px; line-height: 1.1; color: #3B1D33">Your travels, on a map.</h1>
<div style="font-family: 'Gochi Hand', cursive; font-size: 22px; line-height: 1.2; color: #B82A5E">your scrapbook, pinned to the places you went</div>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #6E4A63; max-width: 300px">Import your trip photos and videos. ORBIA pins each one where it happened.</p>
</div>
<div style="width: 100%; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; gap: 6px; justify-content: center" aria-hidden="true"><span style="width: 22px; height: 8px; border-radius: 4px; background: #B82A5E"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #EFC9D5"></span></div>
<button onClick="{{goOnboard2}}" style="height: 56px; width: 100%; border: 5px solid #FFFFFF; border-radius: 18px; transform: rotate(-1.5deg); box-shadow: 0 5px 10px rgba(59,29,51,0.28); font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px; background: #B82A5E; color: #FFFFFF; cursor: pointer">Get started</button>
</div>
</div>
</div>
</sc-if>

<!-- ONBOARDING 2: location -->
<sc-if value="{{isOnboard2}}" hint-placeholder-val="{{ false }}">
<div style="height: 844px; display: flex; flex-direction: column; background: #5B8DEF">
<div style="position: relative; height: 470px; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 46px; box-sizing: border-box">
<svg width="390" height="470" viewBox="0 0 390 470" aria-hidden="true" style="position: absolute; left: 0; top: 0">
<path d="M30 430 C 90 380 60 300 140 300 S 250 360 300 250 S 330 120 370 90" fill="none" stroke="#FFFDF8" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 12"/>
<circle cx="370" cy="90" r="9" fill="#FFC83D"/>
<path d="M70 96 C71.68 108.32 71.68 108.32 84 110 C71.68 111.68 71.68 111.68 70 124 C68.32 111.68 68.32 111.68 56 110 C68.32 108.32 68.32 108.32 70 96 Z" fill="#FFC83D"/><path d="M320 320 C321.2 328.8 321.2 328.8 330 330 C321.2 331.2 321.2 331.2 320 340 C318.8 331.2 318.8 331.2 310 330 C318.8 328.8 318.8 328.8 320 320 Z" fill="#FFFDF8"/><path d="M40 242 C40.96 249.04 40.96 249.04 48 250 C40.96 250.96 40.96 250.96 40 258 C39.04 250.96 39.04 250.96 32 250 C39.04 249.04 39.04 249.04 40 242 Z" fill="#FFFDF8"/>
</svg>
<div style="position: relative"><svg width="230" height="280" viewBox="0 0 230 280" role="img" aria-label="A map pin">
<path d="M115 262 C115 262 30 170 30 110 A85 85 0 0 1 200 110 C200 170 115 262 115 262 Z" fill="#FFFDF8"/>
<circle cx="115" cy="110" r="34" fill="#B82A5E"/>
</svg></div>
</div>
<div style="flex: 1; background: #FFFDF8; border-radius: 36px 36px 0 0; padding: 32px 28px 36px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; align-items: center; text-align: center">
<div style="display: flex; flex-direction: column; gap: 10px; align-items: center">
<h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 30px; line-height: 1.12; color: #3B1D33">Pin new photos automatically</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #6E4A63; max-width: 310px">With location on, photos you take land right where you are. No location? They wait in Unplaced until you pin them.</p>
</div>
<div style="width: 100%; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; gap: 6px; justify-content: center" aria-hidden="true"><span style="width: 8px; height: 8px; border-radius: 4px; background: #EFC9D5"></span><span style="width: 22px; height: 8px; border-radius: 4px; background: #B82A5E"></span></div>
<button onClick="{{allowLocation}}" style="height: 56px; width: 100%; border: 5px solid #FFFFFF; border-radius: 18px; transform: rotate(-1.5deg); box-shadow: 0 5px 10px rgba(59,29,51,0.28); font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px; background: #B82A5E; color: #FFFFFF; cursor: pointer">Allow location</button>
<button onClick="{{skipLocation}}" style="height: 52px; width: 100%; border: 3px solid #B82A5E; border-radius: 6px; background: transparent; color: #B82A5E; font-size: 14px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; cursor: pointer">Continue without location</button>
</div>
</div>
</div>
</sc-if>

<!-- SIGN IN -->
<sc-if value="{{isSignIn}}" hint-placeholder-val="{{ false }}">
<div style="height: 844px; display: flex; flex-direction: column; background: #B82A5E">
<div style="height: 250px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px">
<svg width="120" height="47" viewBox="22 32 572 226" role="img" aria-label="orbia"><g fill="none" stroke="#FFFDF8" stroke-linecap="round" stroke-linejoin="round"><circle cx="92" cy="168" r="50" stroke-width="30"></circle><path d="M92 168 m-6 0 a6 6 0 1 1 12 0 a17 17 0 1 1 -34 0 a27 27 0 1 1 54 0" stroke-width="9"></path><path d="M190 124 L190 214 M190 166 C190 136 213 120 243 124" stroke-width="30"></path><path d="M286 52 L286 214" stroke-width="30"></path><circle cx="334" cy="166" r="48" stroke-width="30"></circle><path d="M430 128 L430 214" stroke-width="30"></path><circle cx="526" cy="166" r="48" stroke-width="30"></circle><path d="M574 124 L574 214 C574 226 572 233 568 238" stroke-width="30"></path></g><circle cx="430" cy="84" r="17" fill="#FFFDF8"></circle></svg>
<div style="font-family: 'Gochi Hand', cursive; font-size: 22px; color: #FFFDF8">save every place you've been</div>
</div>
<div style="flex: 1; background: #FFFDF8; border-radius: 36px 36px 0 0; padding: 30px 28px 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
<h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 28px; line-height: 1.15; color: #3B1D33">Save your memories</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #6E4A63">Sign in so your map and journeys are safe, even if you change phones.</p>
<button onClick="{{socialSignIn}}" style="height: 52px; border: 2px solid #EFC9D5; border-radius: 14px; background: #FFFDF8; color: #3B1D33; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px"><span aria-hidden="true" style="width: 24px; height: 24px; border-radius: 12px; border: 2px solid #3B1D33; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800">G</span>Continue with Google</button>
<button onClick="{{socialSignIn}}" style="height: 52px; border: 0; border-radius: 14px; background: #3B1D33; color: #FFFDF8; font-size: 16px; font-weight: 700; cursor: pointer">Continue with Apple</button>
<div style="display: flex; align-items: center; gap: 10px; color: #6E4A63; font-size: 13px"><span style="flex: 1; height: 1px; background: #EFC9D5"></span>or with email<span style="flex: 1; height: 1px; background: #EFC9D5"></span></div>
<label for="email" style="font-size: 14px; font-weight: 700">Email</label>
<input id="email" type="email" placeholder="you@example.com" value="{{email}}" onChange="{{onEmail}}" style="height: 50px; border: 1.5px solid #E3B3C3; border-radius: 14px; padding: 0 14px; font-size: 16px; font-family: inherit; background: #FFFFFF; color: #3B1D33; box-sizing: border-box">
<div style="flex: 1"></div>
<button onClick="{{sendLink}}" style="height: 56px; width: 100%; border: 5px solid #FFFFFF; border-radius: 18px; transform: rotate(-1.5deg); box-shadow: 0 5px 10px rgba(59,29,51,0.28); font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px; background: #B82A5E; color: #FFFFFF; cursor: pointer">Send magic link</button>
</div>
</div>
</sc-if>

<!-- MAGIC LINK SENT -->
<sc-if value="{{isMagic}}" hint-placeholder-val="{{ false }}">
<div style="height: 844px; display: flex; flex-direction: column; background: #5B8DEF">
<div style="height: 420px; display: flex; align-items: center; justify-content: center">
<svg width="240" height="190" viewBox="0 0 240 190" role="img" aria-label="An envelope with a stamp">
<g transform="rotate(-5 120 95)">
<rect x="20" y="30" width="200" height="140" rx="10" fill="#FFFDF8"/>
<path d="M20 40 L120 110 L220 40" fill="none" stroke="#EFC9D5" stroke-width="6" stroke-linejoin="round"/>
<rect x="160" y="44" width="44" height="52" fill="#F6C9D3" stroke="#FFFDF8" stroke-width="6" stroke-dasharray="0.1 9" stroke-linecap="round"/>

</g>
<path d="M200 20 C 220 6 236 20 232 36" fill="none" stroke="#FFFDF8" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9"/>
</svg>
</div>
<div style="flex: 1; background: #FFFDF8; border-radius: 36px 36px 0 0; padding: 32px 28px 36px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; text-align: center; align-items: center">
<div style="display: flex; flex-direction: column; gap: 10px; align-items: center">
<h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 30px; line-height: 1.15; color: #3B1D33">Check your email</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #6E4A63">We sent a sign-in link to <b style="color: #3B1D33">{{emailShown}}</b>. Tap it on this phone to continue.</p>
</div>
<div style="width: 100%; display: flex; flex-direction: column; gap: 14px">
<button onClick="{{openLink}}" style="height: 56px; width: 100%; border: 5px solid #FFFFFF; border-radius: 18px; transform: rotate(-1.5deg); box-shadow: 0 5px 10px rgba(59,29,51,0.28); font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px; background: #B82A5E; color: #FFFFFF; cursor: pointer">Open the link (demo)</button>
<button onClick="{{backToSignIn}}" style="height: 52px; width: 100%; border: 3px solid #B82A5E; border-radius: 6px; background: transparent; color: #B82A5E; font-size: 14px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; cursor: pointer">Use a different email</button>
</div>
</div>
</div>
</sc-if>

<!-- CAMERA -->
<sc-if value="{{isCamera}}" hint-placeholder-val="{{ false }}">
<div style="position: relative; height: 844px; background: #1A0F17; color: #FFFDF8">
<svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position: absolute; left: 0; top: 0"><rect width="390" height="844" fill="#5E9AA3"/><circle cx="270" cy="250" r="56" fill="#FFC83D"/><path d="M0 560 C 90 470 170 480 240 530 C 300 470 350 470 390 500 L390 844 L0 844 Z" fill="#4F8A93"/><path d="M0 640 C 120 600 260 610 390 630 L390 844 L0 844 Z" fill="#74ACB4"/><g stroke="#FFFDF8" stroke-opacity="0.35" stroke-width="1"><path d="M130 0 V844 M260 0 V844 M0 281 H390 M0 562 H390"/></g></svg>
<div style="position: absolute; left: 16px; right: 16px; top: 18px; display: flex; justify-content: space-between; align-items: center">
<button onClick="{{closeCamera}}" aria-label="Close camera" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(26,15,23,0.55); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFDF8" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
<div style="display: flex; align-items: center; gap: 6px; background: rgba(26,15,23,0.6); padding: 8px 12px; border-radius: 999px; font-size: 13px; font-weight: 700"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFC83D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>{{camLocation}}</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 20px 28px 44px; background: rgba(26,15,23,0.6); display: flex; flex-direction: column; gap: 18px; align-items: center">
<div style="display: flex; gap: 8px"><span style="padding: 6px 14px; border-radius: 999px; background: #FFFDF8; color: #3B1D33; font-size: 13px; font-weight: 800">Photo</span><span style="padding: 6px 14px; border-radius: 999px; color: #FFFDF8; font-size: 13px; font-weight: 700">Video</span></div>
<div style="width: 100%; display: flex; align-items: center; justify-content: space-between">
<button onClick="{{openPicker}}" aria-label="Choose from gallery" style="width: 52px; height: 52px; border-radius: 10px; border: 3px solid #FFFDF8; background: #D59A6A; cursor: pointer"></button>
<button onClick="{{capture}}" aria-label="Take photo" style="width: 80px; height: 80px; border-radius: 40px; border: 6px solid #FFFDF8; background: #B82A5E; cursor: pointer; box-shadow: 0 0 0 4px rgba(255,253,248,0.35)"></button>
<span style="width: 52px"></span>
</div>
</div>
</div>
</sc-if>

<!-- MAIN APP -->
<sc-if value="{{isMain}}" hint-placeholder-val="{{ false }}">
<div style="position: relative; height: 760px; overflow: hidden">

<!-- MAP -->
<sc-if value="{{isMap}}" hint-placeholder-val="{{ true }}">
<div style="position: relative; width: 390px; height: 760px">
<div ref="{{setMapEl}}" onDoubleClick="{{zoomIn}}" style="position: absolute; left: 0; top: 0; width: 390px; height: 760px; overflow: auto; overscroll-behavior: contain; touch-action: pan-x pan-y">
<div style="position: relative; width: {{mapW}}px; height: {{mapH}}px">
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 760px; transform: scale({{zoom}}); transform-origin: 0 0">
<svg width="390" height="760" viewBox="0 0 390 760" aria-hidden="true" style="position: absolute; left: 0; top: 0">
<defs>

</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<button onClick="{{goUnplaced}}" style="height: 56px; border: 5px solid #FFFFFF; border-radius: 18px; transform: rotate(-1.5deg); box-shadow: 0 5px 10px rgba(59,29,51,0.28); font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px; background: #B82A5E; color: #fff; cursor: pointer">Place them now</button>

<!-- UNPLACED -->
<sc-if value="{{isUnplaced}}" hint-placeholder-val="{{ false }}">

</button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="place-search" style="font-size: 14px; font-weight: 700">Where were these taken?</label>
<input id="place-search" type="search" placeholder="Search a place" value="{{query}}" onChange="{{onQuery}}" style="height: 48px; border: 1.5px solid #E3B3C3; border-radius: 14px; padding: 0 14px; font-size: 15px; font-family: inherit; background: #FFFDF8; color: #3B1D33; box-sizing: border-box">

</div>
<button onClick="{{confirmPlace}}" disabled="{{cantPlace}}" style="height: 56px; border: 5px solid #FFFFFF; border-radius: 18px; transform: rotate(-1.5deg); box-shadow: 0 5px 10px rgba(59,29,51,0.28); font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px; background: {{placeBtnBg}}; color: {{placeBtnColor}}; cursor: pointer">{{placeBtnLabel}}</button>
</div>

</sc-if>

<!-- PICKER -->
<sc-if value="{{isPicker}}" hint-placeholder-val="{{ false }}">
<div style="height: 760px; padding: 16px 16px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">

<button onClick="{{pickAll}}" style="height: 36px; padding: 0 12px; border: 0; border-radius: 10px; background: #F6C9D3; color: #3B1D33; font-size: 13px; font-weight: 700; cursor: pointer">Select all</button>
</div>

<sc-if value="{{g.selected}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 11px; background: #B82A5E; border: 2px solid #FFFDF8; display: flex; align-items: center; justify-content: center; color: #FFFDF8; font-size: 11px; font-weight: 800">{{g.order}}</span></sc-if>
<sc-if value="{{g.noLoc}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 4px; bottom: 4px; background: rgba(59,29,51,0.75); color: #FFFDF8; font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 4px">no location</span></sc-if>
</button>
</sc-for>
</div>
<div style="flex: 1"></div>
<button onClick="{{startUpload}}" disabled="{{cantImport}}" style="height: 56px; width: 100%; border: 5px solid #FFFFFF; border-radius: 18px; transform: rotate(-1.5deg); box-shadow: 0 5px 10px rgba(59,29,51,0.28); font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px; background: #B82A5E; color: #FFFFFF; cursor: pointer">{{importLabel}}</button>

</div>

<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700; color: #3B1D33">Import from gallery</span><span style="font-size: 13px; color: #6E4A63">Up to 50 photos and videos at a time</span></span>

</div>
</div>
</sc-if>

<!-- CONFIRM SHEET -->
<sc-if value="{{hasConfirm}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: rgba(59,29,51,0.45); display: flex; flex-direction: column; justify-content: flex-end; z-index: 20">
<div role="alertdialog" aria-label="{{confirmTitle}}" style="background: #FFFDF8; border-radius: 24px 24px 0 0; padding: 26px 20px 22px; display: flex; flex-direction: column; gap: 12px">
<h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 24px; line-height: 1.15; color: #3B1D33">{{confirmTitle}}</h1>

<button onClick="{{doConfirm}}" style="height: 56px; width: 100%; border: 5px solid #FFFFFF; border-radius: 18px; transform: rotate(-1.5deg); box-shadow: 0 5px 10px rgba(59,29,51,0.28); font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px; background: #B82A5E; color: #FFFFFF; cursor: pointer; margin-top: 6px">{{confirmCta}}</button>

</div>
</sc-if>

<!-- TOAST -->

</sc-if>
</div>

<!-- TAB BAR -->
<nav aria-label="Main" style="height: 84px; background: #FFFDF8; border-top: 1px solid #EFC9D5; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 8px; box-sizing: border-box">
<button onClick="{{goMap}}" style="position: relative; width: 64px; height: 52px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; color: {{tabMap}}; font-size: 11px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{tabMap}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>Map</button>
<button onClick="{{goJourneys}}" style="position: relative; width: 64px; height: 52px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; color: {{tabJourneys}}; font-size: 11px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{tabJourneys}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 10h18M8 4v6"/></svg>Journeys</button>
<button onClick="{{openAdd}}" aria-label="Add memories" style="width: 56px; height: 56px; margin-top: -18px; border: 4px solid #FFFFFF; border-radius: 18px; background: #B82A5E; display: flex; align-items: center; justify-content: center; cursor: pointer; transform: rotate(-4deg); box-shadow: 0 5px 10px rgba(59,29,51,0.28)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<button onClick="{{goUnplaced}}" style="position: relative; width: 64px; height: 52px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; color: {{tabInbox}}; font-size: 11px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{tabInbox}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 13h5l2 3h4l2-3h5"/></svg>Unplaced<sc-if value="{{hasUnplaced}}" hint-placeholder-val="{{ true }}"><span style="position: absolute; top: -4px; right: 10px; min-width: 18px; height: 18px; border-radius: 9px; background: #B82A5E; color: #FFFFFF; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; padding: 0 4px; box-sizing: border-box">{{unplacedCount}}</span></sc-if></button>
<button onClick="{{goProfile}}" style="position: relative; width: 64px; height: 52px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; color: {{tabMe}}; font-size: 11px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{tabMe}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Me</button>
</nav>
</sc-if>
</div></template>
<script src="https://unpkg.com/preact@10.24.3/dist/preact.umd.js"></script>

<script>
(function () {
  var frame = document.getElementById('frame'), phone = document.getElementById('phone');
  function fit() {
    var w = window.innerWidth, hgt = window.innerHeight, mobile = w < 520, s;
    document.body.classList.toggle('mobile', mobile);
    if (mobile) s = w / 390;
    else s = Math.min(1, (hgt - 150) / 844, (w - 40) / 390);
    s = Math.max(s, 0.4);
    phone.style.transform = 'scale(' + s + ')';
    frame.style.width = (390 * s) + 'px';
    frame.style.height = (844 * s) + 'px';
  }
  window.addEventListener('resize', fit); fit();
  var start = new URLSearchParams(location.search).get('start') || undefined;
  mountScreens(Component, document.getElementById('screens'), document.getElementById('app'), { start: start });
})();
</script>
